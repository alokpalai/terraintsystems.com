# Netlify configuration for the TerraINT Systems site.
# The generated pages are committed, so Netlify serves the folder as-is (no build step).

[build]
  publish = "."
  command = ""

# Source/tooling folders live in the repo but must not be public.
[[redirects]]
  from = "/tools/*"
  to = "/404.html"
  status = 404
  force = true

[[redirects]]
  from = "/docs/*"
  to = "/404.html"
  status = 404
  force = true

[[redirects]]
  from = "/README.md"
  to = "/404.html"
  status = 404
  force = true

[[redirects]]
  from = "/netlify.toml"
  to = "/404.html"
  status = 404
  force = true
